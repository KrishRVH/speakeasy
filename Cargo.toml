[workspace]
members = ["crates/core", "crates/show", "crates/platform", "crates/app"]
exclude = [
  "vendor/accesskit_windows",
  "vendor/gpui-pre",
  "vendor/gpui-pre-apple",
  "vendor/gpui-pre-linux",
  "vendor/gpui-pre-macos",
  "vendor/gpui-pre-wgpu",
  "vendor/gpui-pre-windows",
]
resolver = "3"

[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
# libloading, tiny-skia, wayland-client, x11rb, and zbus match the majors GPUI brings in, so each
# compiles once; move them with GPUI.
anyhow = "1.0.104"
# arboard claims the X11 clipboard through x11rb's pure-Rust resolver, which Speakeasy's own
# connections avoid (linux/x11.rs `connect`). x11rb 0.13 tries the abstract socket WSLg serves; 0.14
# drops it and falls back to TCP, which hangs there. Check an arboard bump that moves to x11rb 0.14
# under WSLg.
arboard = { version = "3.7.0", default-features = false }
async-channel = "2.5.0"
base64 = "0.23"
block2 = "0.6.2"
clipboard-win = "5.4.3"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
cpal = "0.18.2"
dispatch2 = "0.3.1"
crc32fast = "1.5.4"
embed-resource = "3.0.12"
fdeflate = "0.3.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui_linux = { package = "gpui-pre-linux", version = "=0.3.12", default-features = false }
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.12", default-features = false }
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.12", default-features = false }
image = { version = "0.25.10", default-features = false }
libc = "0.2.191"
libloading = "0.8.9"
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-application-services = { version = "0.3.2", default-features = false }
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false }
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", default-features = false }
png = "0.18.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false }
ring = "0.17.14"
rtrb = "0.4.1"
# Linux TLS runs on ring, which the app links for update signatures; the default would add AWS-LC.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = "1.0.229"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
tempfile = "3.27.0"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
tokio = "1.54.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tray-icon = { version = "0.26.1", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
windows = "0.62.2"
windows-core = "0.62.2"
# The release whose async types windows returns; move it with windows.
windows-future = "0.3.2"
windows-sys = "0.61.2"
unicode-segmentation = "1.13.3"
wayland-client = "0.31.11"
x11rb = "0.13.2"
# Ahead of GPUI's 0.8, which panics on a keymap that holds an interior NUL.
xkbcommon = "0.9.0"
zbus = { version = "5.19.0", default-features = false }
zeroize = "1.9.1"
zip = { version = "9.5.0", default-features = false }

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
# Borrows stay visible in paths (`Formatter<'_>`), and inferable outlives bounds go.
rust_2018_idioms = { level = "deny", priority = -1 }
# Public interfaces stay reachable and implement `Debug` without exposing private content.
missing_debug_implementations = "deny"
unexpected_cfgs = "deny"
unreachable_pub = "deny"
# Native FFI lives in platform; every other crate root forbids unsafe locally, as `mise run hygiene`
# checks.
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
# Crate and native contracts live in docs/; rustdoc still checks the generated interface index.
missing_crate_level_docs = "allow"

[workspace.lints.clippy]
# Named lints override these groups. Nursery warns locally and fails the
# warnings-denied gate; known false positives are disabled below.
all = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Exceptions use a reasoned `#[expect]`, never `#[allow]`. Forbid, not deny, so
# no source attribute can expect these two away.
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

# Rust source is comment-free. Architecture and native contracts document interfaces and FFI;
# these lints can only recognize inline documentation.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Production code handles failure explicitly. Tests may assert established
# invariants through the clippy.toml `allow-*-in-tests` settings.
# Arithmetic has no test setting. Where Clippy checks fixture helpers and
# properties, use checked arithmetic; only operator tests expect the lint.
# Wrapping and saturation remain explicit when the domain requires them.
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Discarding a fallible result requires a local reason.
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"

# The print macros panic when the stream closes; program output goes through fallible I/O.
print_stderr = "deny"
print_stdout = "deny"

# Immutable `Arc` snapshots are the permitted sharing: `Arc::clone` keeps shared ownership visible
# at the call site, and `Arc<str>` or `Arc<[T]>` avoids a growable buffer behind a second pointer.
clone_on_ref_ptr = "deny"
rc_buffer = "deny"

# Dependency hygiene.
wildcard_dependencies = "deny"

# Deep nesting is context-hostile; the threshold lives in clippy.toml.
excessive_nesting = "deny"

# Lossy casts (truncation, wrap, sign loss) are denied by pedantic above:
# conversions go through From/TryFrom or checked methods. These two remain
# allowed: int-to-float precision loss is usually intended, and widening `as`
# casts are harmless in systems code.
cast_lossless = "allow"
cast_precision_loss = "allow"

# `pub(crate)` satisfies unreachable_pub but triggers this nursery lint.
redundant_pub_crate = "allow"

# `mul_add` lowers to a libm call on the x86-64 baseline (no FMA); per-frame
# pixel loops use plain arithmetic.
suboptimal_flops = "allow"

# Deliberately relaxed style lints: size and repetition counts are poor
# proxies for wrongness and generate churn instead of findings.
cognitive_complexity = "allow"
enum_variant_names = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
only_used_in_recursion = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
use_self = "allow"

# Dev and test builds keep file:line for first-party and patched GPUI frames and drop other
# dependency debuginfo. Full debuginfo for one build: --config 'profile.dev.debug="full"'
# --config 'profile.dev.package."*".debug="full"' --config 'profile.dev.package.gpui-pre.debug="full"'
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.gpui-pre]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
