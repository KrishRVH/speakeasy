[package]
name = "speakeasy-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_UI_HiDpi", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
block2 = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSScreen", "NSAlert"] }
objc2-foundation = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
