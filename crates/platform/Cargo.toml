[package]
name = "speakeasy-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
raw-window-handle.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
zbus = { workspace = true, features = ["tokio"] }
futures-util.workspace = true
libloading.workspace = true
x11rb = { workspace = true, features = ["shape", "xinput", "xkb", "xtest"] }
xkbcommon.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { workspace = true, features = ["std"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard.workspace = true
block2.workspace = true
core-foundation.workspace = true
core-graphics.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSApplication", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
