[package]
name = "speakeasy-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3"
libloading = "0.8"
x11rb = { version = "0.13.2", features = ["shape", "xinput", "xkb", "xtest"] }
xkbcommon = "0.8"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
