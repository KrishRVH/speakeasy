[package]
name = "speakeasy-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
raw-window-handle.workspace = true
png.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "process", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
zbus = { workspace = true, features = ["tokio"] }
futures-util.workspace = true
libloading.workspace = true
x11rb = { workspace = true, features = ["allow-unsafe-code", "shape", "xinput", "xkb", "xtest"] }
xkbcommon.workspace = true
tempfile.workspace = true
# `net` provides `tokio::io::unix::AsyncFd`, which waits on the X11, libei, and portal transfer
# descriptors.
tokio = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { workspace = true, features = ["std"] }
windows = { workspace = true, features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
windows-core.workspace = true
windows-future.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard.workspace = true
block2.workspace = true
core-foundation.workspace = true
core-graphics.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAccessibility", "NSAlert", "NSApplication", "NSEvent", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "libc"] }
objc2-application-services = { workspace = true, features = ["AXUIElement", "HIServices"] }
objc2-av-foundation = { workspace = true, features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace", "CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGWindow"] }
objc2-core-media = { workspace = true, features = ["CMSampleBuffer", "objc2", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation.workspace = true
objc2-screen-capture-kit = { workspace = true, features = ["SCError", "SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_StationsAndDesktops"] }

[lints]
workspace = true
