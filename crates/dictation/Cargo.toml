[package]
name = "speakeasy-dictation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
speakeasy-core = { path = "../core" }
speakeasy-platform = { path = "../platform" }
anyhow.workspace = true
async-channel.workspace = true
cpal.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
rtrb.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["rustls"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Setup downloads over the operating system's TLS stack and trust store.
reqwest = { workspace = true, features = ["native-tls"] }

[lints]
workspace = true
