[package]
name = "speakeasy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
# build.rs uses this to embed the Windows manifest and application resources.
ignored = ["embed-resource"]

[dependencies]
speakeasy-core = { path = "../core" }
speakeasy-platform = { path = "../platform" }
speakeasy-show = { path = "../show" }
anyhow.workspace = true
async-channel.workspace = true
cpal.workspace = true
getrandom.workspace = true
gpui = { workspace = true, features = ["font-kit"] }
raw-window-handle.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
rtrb.workspace = true
serde = { workspace = true, features = ["derive"] }
# Saves patch the user's file in place, so its keys keep their order.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["x11"] }
# Setup downloads over rustls on ring with the system trust store; http.rs supplies the provider.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { workspace = true, features = ["allow-unsafe-code", "shape"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Setup downloads over the operating system's TLS stack and trust store.
reqwest = { workspace = true, features = ["native-tls"] }
tray-icon.workspace = true

[lints]
workspace = true
