[package]
name = "speakeasy"
default-run = "speakeasy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
native-acceptance = ["dep:objc2", "dep:objc2-app-kit"]

[package.metadata.cargo-machete]
# build.rs uses this to embed the Windows manifest and application resources.
ignored = ["embed-resource"]

[dependencies]
speakeasy-core = { path = "../core" }
speakeasy-platform = { path = "../platform" }
speakeasy-show = { path = "../show" }
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
cpal.workspace = true
crc32fast.workspace = true
getrandom.workspace = true
futures-util.workspace = true
gpui.workspace = true
image = { workspace = true, features = ["png"] }
raw-window-handle.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
ring.workspace = true
rtrb.workspace = true
serde = { workspace = true, features = ["derive"] }
# Saves patch the user's file in place, so its keys keep their order.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_path_to_error.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
unicode-segmentation.workspace = true
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true, features = ["wayland", "x11"] }
# HTTPS uses rustls on ring with the system trust store; http.rs supplies the provider.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { workspace = true, features = ["allow-unsafe-code", "shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true, features = ["font-kit"] }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = ["NSApplication", "NSResponder", "NSRunningApplication", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows.workspace = true
tray-icon.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda.workspace = true
# HTTPS uses the operating system's TLS stack and trust store.
reqwest = { workspace = true, features = ["native-tls"] }

[lints]
workspace = true
