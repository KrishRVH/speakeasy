[package]
name = "speakeasy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
speakeasy-core = { path = "../core" }
speakeasy-platform = { path = "../platform" }
anyhow = "1"
async-channel = "2"
cpal = "0.18.2"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Setup downloads over the operating system's TLS stack and trust store.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tray-icon = { version = "0.25.1", default-features = false }

[lints]
workspace = true
