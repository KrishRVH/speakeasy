[package]
name = "speakeasy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
speakeasy-core = { path = "../core" }
speakeasy-platform = { path = "../platform" }
anyhow = "1"
async-channel = "2"
cpal = "0.18.2"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt", "time", "process", "net", "macros", "sync", "io-util"] }
tempfile = "3"
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }

[lints]
workspace = true
