# Clippy reads the MSRV from Cargo.toml's `rust-version`; a second pin here would override it and
# drift silently on a toolchain bump.

# An application makes no external compatibility promise, so API-shape lints such as
# `unnecessary_wraps`, `trivially_copy_pass_by_ref`, and `wrong_self_convention` cover `pub` items
# too.
avoid-breaking-exported-api = false

# The panic-free wall applies to production code; tests may assert invariants the test itself
# established, and print to the test runner's captured output.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

# Shared mutable state (AGENTS.md ownership and interfaces): each value has one owner, and other
# threads send it events over channels. Escape per site with
# `#[expect(clippy::disallowed_types, reason = "...")]`, naming the shared value and why it cannot
# belong to its owner or arrive as an event.
disallowed-types = [
  { path = "std::sync::Mutex", reason = "send the event to the state's owning thread over a channel instead of reaching into state through a lock (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::RwLock", reason = "send the event to the state's owning thread over a channel instead of reaching into state through a lock (AGENTS.md ownership and interfaces)" },
  { path = "std::rc::Rc", reason = "shared ownership hides the owner; give the value one owner and pass it as an event or borrow (AGENTS.md ownership and interfaces)" },
  { path = "std::cell::RefCell", reason = "runtime borrow panics replace compile-time ownership; restructure so the owner mutates directly (AGENTS.md ownership and interfaces)" },
  { path = "std::cell::Cell", reason = "interior mutability hides writes; restructure so the owner mutates directly (AGENTS.md ownership and interfaces)" },
  { path = "std::cell::OnceCell", reason = "a lazily set cell hides when state is written; compute the value where the owner is built (AGENTS.md ownership and interfaces)" },
  { path = "std::cell::LazyCell", reason = "a lazily set cell hides when state is written; compute the value where the owner is built (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicBool", reason = "ambient flags are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicI8", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicI16", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicI32", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicI64", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicIsize", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicPtr", reason = "ambient shared pointers are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicU8", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicU16", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicU32", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicU64", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "std::sync::atomic::AtomicUsize", reason = "ambient counters are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  # Ecosystem equivalents inherit the doctrine unchanged: routing around a disallowed std primitive
  # through a dependency is a violation, not an escape. These entries are inert until the crate
  # enters the graph; the tokio entries also accept a graph whose tokio lacks the `sync` feature.
  { path = "tokio::sync::Mutex", reason = "send the event to the task that owns the state over a channel instead of reaching into state through a lock (AGENTS.md ownership and interfaces)", allow-invalid = true },
  { path = "tokio::sync::RwLock", reason = "send the event to the task that owns the state over a channel instead of reaching into state through a lock (AGENTS.md ownership and interfaces)", allow-invalid = true },
  { path = "parking_lot::Mutex", reason = "send the event to the state's owning thread over a channel instead of reaching into state through a lock (AGENTS.md ownership and interfaces)" },
  { path = "parking_lot::RwLock", reason = "send the event to the state's owning thread over a channel instead of reaching into state through a lock (AGENTS.md ownership and interfaces)" },
  { path = "dashmap::DashMap", reason = "a concurrent map is shared mutable state; give the map one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "crossbeam_utils::atomic::AtomicCell", reason = "ambient cells are state; give the value one owner and send it events (AGENTS.md ownership and interfaces)" },
  { path = "portable_atomic::AtomicU64", reason = "an atomic behind a dependency is still ambient state; give the value one owner (AGENTS.md ownership and interfaces)" },
]

# No thread_local! entry: Clippy reports it on the macro call, which cannot take `expect`, so only
# a module-wide expectation could escape it. The mutable types above carry the per-site reason.

disallowed-methods = [
  { path = "std::process::abort", reason = "no unwind, no destructors, no message; return an error from main or use the panic path the doctrine already forbids you to reach (AGENTS.md ownership and interfaces)" },
  { path = "std::boxed::Box::leak", reason = "a deliberate leak is ambient 'static state; give the value one owner or justify the leak at the use site (AGENTS.md ownership and interfaces)" },
  { path = "std::mem::ManuallyDrop::new", reason = "suppressing Drop is a leak or an ownership dodge; restructure ownership instead (AGENTS.md ownership and interfaces)" },
  { path = "reqwest::Client::new", reason = "build clients through http::client_builder; Linux reqwest has no built-in rustls provider and panics in build()" },
  { path = "reqwest::Client::builder", reason = "build clients through http::client_builder; Linux reqwest has no built-in rustls provider and panics in build()" },
  { path = "reqwest::ClientBuilder::new", reason = "build clients through http::client_builder; Linux reqwest has no built-in rustls provider and panics in build()" },
  { path = "reqwest::get", reason = "build clients through http::client_builder; Linux reqwest has no built-in rustls provider and panics in build()" },
]

# Accepted identifiers for documentation prose checked by doc_markdown. The ".." entry extends
# clippy's default list instead of replacing it.
doc-valid-idents = [
  "..",
  "API",
  "APIs",
  "ASCII",
  "CLI",
  "CPU",
  "FFI",
  "HTTP",
  "HTTPS",
  "ID",
  "IDs",
  "IO",
  "JSON",
  "MSRV",
  "OS",
  "TLS",
  "URI",
  "URL",
  "URLs",
  "UTF-8",
  "UUID",
]

# enum-variant-size, bool-params, single-char, and too-many-arguments pin Clippy's current defaults
# so an upstream change cannot silently loosen the wall. The nesting threshold turns on
# `excessive_nesting`, which Clippy's default threshold of 0 leaves off.
enum-variant-size-threshold = 200
excessive-nesting-threshold = 5
max-fn-params-bools = 3
single-char-binding-names-threshold = 4
too-many-arguments-threshold = 7

# GPUI's and Show's f32 coordinate types have the same non-panicking arithmetic as primitive floats;
# integer sizes, counters and deadlines do not. Clippy names a type from the crate being linted by
# its path within that crate.
arithmetic-side-effects-allowed = ["gpui::Pixels", "geometry::Point"]
