[default]
locale = "en-us"

[default.extend-words]
# Emulated Input Server is the native portal/libei interface name.
EIS = "EIS"

[type.rust.extend-words]
# ISO 639 language codes in the Whisper language catalog.
ba = "ba"
fo = "fo"
# ISO BMFF track and track-run box types.
trak = "trak"
trun = "trun"

[files]
# Dotfiles hold the CI workflows and the task and tool config.
ignore-hidden = false
extend-exclude = [".git", "vendor", "Cargo.lock", "bun.lock", "uv.lock", ".config/mise/mise.lock"]
