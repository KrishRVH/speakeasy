# CI's mise writes the lockfile; older releases read it but drop the fields they do not know.
min_version = { hard = "2026.9.18", soft = "2026.11.12" }

[settings]
task.quiet = true
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[vars]
# Tasks that pipe this list run under bash with pipefail, which /bin/sh lacks on older dash: without
# it a git failure hands the markdown tool an empty list, and it passes.
md_files = '''git ls-files -z --cached --others --exclude-standard -- '*.md' ':(exclude)vendor/' '''
# Linux owned-window checks need a private X11 display, and GPUI chooses Wayland whenever
# WAYLAND_DISPLAY is set; Windows and macOS use the native desktop.
private_display = "{% if os() == 'linux' %}env -u WAYLAND_DISPLAY xvfb-run -a {% endif %}"

[env]
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"

[tools]
"github:bnjbvr/cargo-machete" = "0.10.1"
# Packaging generates each archive's third-party notices from the locked dependency graph.
"github:EmbarkStudios/cargo-about" = "0.9.3"
"github:nextest-rs/nextest" = { version = "0.9.152", version_prefix = "cargo-nextest-" }
python = "3.15.2"
uv = "0.13.9"
bun = "1.4.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
# Static Linux build keeps the local gate usable on glibc 2.35.
lychee = { version = "0.24.2", libc = "musl" }
typos = "1.52.2"
actionlint = "1.7.12"

# A dependency change is when a crate can bring a license packaging cannot cite, so the check runs
# here rather than in every gate; its notices cover all three packaged targets at once.
[tasks."rust:lock"]
description = "Refresh the Cargo lockfiles after manifest changes and check packaging can cite every license"
run = [
  "cargo update --workspace",
  "cargo update --manifest-path vendor/accesskit_windows/Cargo.toml --workspace",
  "mkdir -p target && cargo about generate --locked --fail -c packaging/about.toml --target x86_64-pc-windows-msvc --target aarch64-apple-darwin --target x86_64-unknown-linux-gnu -o target/THIRD-PARTY-NOTICES.txt packaging/notices.hbs",
]

[tasks."rust:fmt"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."rust:fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

# The cross-target run type-checks the native adapters, which need no SDK; the app's Windows
# resource build and macOS GPUI build do, so they stay with native checks.
[tasks."rust:lint"]
description = "Run Clippy on the workspace, and on the platform crate for Windows and macOS"
run = [
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
  "cargo clippy -p speakeasy-platform --all-targets --all-features --locked --target x86_64-pc-windows-msvc --target aarch64-apple-darwin -- -D warnings",
]

[tasks."rust:doc"]
description = "Build the workspace docs with warnings denied"
wait_for = ["rust:lint"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps --locked"

[tasks."rust:test"]
description = "Run Rust unit and integration tests"
wait_for = ["rust:doc"]
run = [
  "cargo nextest run --workspace --lib --bins --tests --all-features --locked",
  "{% if os() == 'windows' %}cargo test --manifest-path vendor/accesskit_windows/Cargo.toml --target-dir target/accesskit-tests --lib --locked -- text:: adapter::{% else %}true{% endif %}",
]

[tasks."rust:explore"]
description = "Explore every reachable session machine state (opt-in; under a minute and 1 GB on 32 threads)"
run = "cargo test --locked --release -p speakeasy-core --lib machine::explore"
env = { SPEAKEASY_EXPLORE_DEPTH = "all" }

[tasks."rust:machete"]
description = "Find unused Rust dependencies"
depends = ["rust:fetch"]
env = { CARGO_NET_OFFLINE = "true" }
run = "cargo machete --with-metadata --skip-target-dir crates"

[tasks."rust:fetch"]
description = "Fetch every platform's locked dependency sources for offline analysis"
run = "cargo fetch --locked"

[tasks."rust:standards"]
description = "Apply Rust formatting"
depends = ["rust:fmt"]

[tasks."rust:standards:check"]
description = "Run every Rust check"
depends = ["rust:fmt:check", "rust:lint", "rust:doc", "rust:test", "rust:machete"]

[tasks."py:lock"]
description = "Refresh uv.lock after Python tool requirements change"
run = "uv lock"

[tasks."py:install"]
description = "Install the locked Python tools"
run = "uv sync --locked --quiet"

[tasks."py:fmt"]
description = "Format Python"
depends = ["py:install"]
run = "uv run --no-sync ruff format --quiet scripts tests"

[tasks."py:fmt:check"]
description = "Check Python formatting"
depends = ["py:install"]
run = "uv run --no-sync ruff format --check --quiet scripts tests"

[tasks."py:lint"]
description = "Lint Python with Ruff"
depends = ["py:install"]
run = "uv run --no-sync ruff check --quiet scripts tests"

[tasks."py:type"]
description = "Type-check Python with basedpyright"
depends = ["py:install"]
run = "uv run --no-sync basedpyright"

[tasks."py:test"]
description = "Run the Python tests"
depends = ["py:install"]
run = "uv run --no-sync pytest -q"

[tasks."py:standards"]
description = "Apply Ruff fixes and formatting to Python"
depends = ["py:install"]
run = ["uv run --no-sync ruff check --fix --quiet scripts tests", { task = "py:fmt" }]

[tasks."py:standards:check"]
description = "Run every Python check"
depends = ["py:fmt:check", "py:lint", "py:type", "py:test"]

# shfmt reads .editorconfig only when no parser or printer flags are passed.
[tasks."shell:fmt"]
description = "Format shell scripts"
run = "shfmt -w scripts/*.sh packaging/linux/AppRun"

[tasks."shell:fmt:check"]
description = "Check shell formatting"
run = "shfmt -d scripts/*.sh packaging/linux/AppRun"

[tasks."shell:lint"]
description = "Lint shell scripts with ShellCheck"
run = "shellcheck --severity=style scripts/*.sh packaging/linux/AppRun"

[tasks."shell:standards"]
description = "Apply shell formatting"
depends = ["shell:fmt"]

[tasks."shell:standards:check"]
description = "Run every shell check, including the Python tests that run the scripts"
depends = ["shell:fmt:check", "shell:lint", "py:test"]

[tasks."md:lock"]
description = "Refresh bun.lock after Markdown tool requirements change"
run = "bun install"

[tasks."md:install"]
description = "Install the locked Markdown tools"
run = "bun install --frozen-lockfile --no-summary"

[tasks."md:fmt"]
description = "Format Markdown"
depends = ["md:install"]
shell = "bash -o errexit -o pipefail -c"
run = "{{vars.md_files}} | xargs -0 bun run prettier --write --no-error-on-unmatched-pattern"

[tasks."md:fmt:check"]
description = "Check Markdown formatting"
depends = ["md:install"]
shell = "bash -o errexit -o pipefail -c"
run = "{{vars.md_files}} | xargs -0 bun run prettier --check --no-error-on-unmatched-pattern --log-level warn"

[tasks."md:lint"]
description = "Lint Markdown"
depends = ["md:install"]
shell = "bash -o errexit -o pipefail -c"
run = "{{vars.md_files}} | xargs -0 bun run markdownlint-cli2"

[tasks."md:links"]
description = "Check Markdown links to repository files and anchors, offline"
run = "lychee --config lychee.toml --root-dir \"$PWD\" --offline --extensions md ."

[tasks."md:links:deep"]
description = "Check Markdown links, including external URLs, over the network"
run = "lychee --config lychee.toml --root-dir \"$PWD\" --extensions md ."

[tasks."md:typos"]
description = "Check spelling in file contents and names"
run = "typos --config typos.toml ."

[tasks."md:standards"]
description = "Apply Prettier and markdownlint fixes to Markdown"
depends = ["md:fmt"]
shell = "bash -o errexit -o pipefail -c"
run = "{{vars.md_files}} | xargs -0 bun run markdownlint-cli2 --fix"

[tasks."md:standards:check"]
description = "Run every Markdown check"
depends = ["md:fmt:check", "md:lint", "md:links", "md:typos"]

[tasks.fmt]
description = "Format every language"
depends = ["rust:fmt", "py:fmt", "shell:fmt", "md:fmt"]

[tasks."fmt:check"]
description = "Check every language's formatting"
depends = ["rust:fmt:check", "py:fmt:check", "shell:fmt:check", "md:fmt:check"]

[tasks.lint]
description = "Run every linter and type checker"
depends = ["rust:lint", "py:lint", "py:type", "shell:lint", "md:lint", "ci:lint"]

[tasks.test]
description = "Run the Rust and Python tests"
depends = ["rust:test", "py:test"]

[tasks.standards]
description = "Apply every safe formatter and autofix"
depends = ["rust:standards", "py:standards", "shell:standards", "md:standards"]

[tasks."standards:check"]
description = "Run the final local gate"
depends = ["rust:standards:check", "py:standards:check", "shell:standards:check", "md:standards:check", "ci:lint", "hygiene"]

[tasks."ci:lint"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks."ps:syntax"]
description = "Parse Windows scripts on a native PowerShell host"
shell = "pwsh -NoProfile -Command"
run = """
foreach ($script in Get-ChildItem scripts/*.ps1) {
  $parseErrors = $null
  $tokens = $null
  $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
  if ($parseErrors) { throw ($parseErrors | Out-String) }
}
"""

[tasks.hygiene]
description = "Check committed names, mise task references, workspace lint inheritance, and unsafe-code forbids"
run = "python scripts/check_repository.py"

# Opt-in native checks open owned windows, record an owned scene, or need the named system, so the
# gate depends on none of them. The README's packaging and native checks say what each touches and
# which variables name its fixtures. Windows tasks that quote arguments run in PowerShell, because
# cmd.exe does not honor the quoting that Rust gives an argument.

[tasks."native:rendering"]
description = "Render an owned non-activating window through SVG frames, resizes, and show/hide"
run = "{{vars.private_display}}cargo run --locked -p speakeasy --example check_native_rendering -- --native-gui"

[tasks."native:review"]
description = "Check synthetic Show review in an owned window on Windows or Linux"
run = "{{vars.private_display}}cargo test --locked -p speakeasy native_show_review_ -- --ignored --test-threads=1"

# Each filter runs in its own process, which owns one GPUI application.
[tasks."native:settings"]
description = "Check Settings IME, saves, pickers, and onboarding in owned windows on Windows or Linux"
run = [
  "{{vars.private_display}}cargo test --locked -p speakeasy native_phrase_editor_ -- --ignored --test-threads=1",
  "{{vars.private_display}}cargo test --locked -p speakeasy native_settings_picker_ -- --ignored --test-threads=1",
]

[tasks."linux:demo"]
description = "Build the release app and check its Settings, Shows, and pill on a private Xvfb display"
run = ["cargo build --release --locked -p speakeasy", "python scripts/check_demo_linux.py target/release/speakeasy"]

[tasks."windows:accessibility"]
description = "Build the app test executable and check its static Settings fixture through UI Automation"
shell = "pwsh -NoProfile -Command"
run = """
$built = cargo test --locked -p speakeasy --bin speakeasy --no-run --message-format=json
if ($LASTEXITCODE -ne 0) { throw 'The app test executable did not build.' }
$test = $built | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'speakeasy' -and $_.profile.test -and $_.executable } | Select-Object -Last 1
if (-not $test) { throw 'Cargo reported no app test executable.' }
./scripts/check-demo-windows.ps1 -Executable $test.executable -StaticAccessibility
"""

[tasks."windows:clipboard"]
description = "Check paste on a private window station, whose clipboard is never the desktop's"
shell = "pwsh -NoProfile -Command"
run = "cargo nextest run --workspace --lib --bins --tests --all-features --locked --run-ignored only -E 'package(speakeasy-platform) & test(copied_text_stays_private)'"

[tasks."windows:geometry"]
description = "Move and hide an owned window and check its tracked bounds without sampling input"
run = "cargo test --locked -p speakeasy-platform target_geometry_tracks_an_owned_window_without_sampling_input -- --ignored --test-threads=1"

[tasks."windows:capture"]
description = "Record only an owned, blacked-out scene under still backpressure until the session deadline"
run = "cargo test --locked -p speakeasy-platform a_movie_survives_still_backpressure_and_closes_at_the_session_deadline -- --ignored --test-threads=1"

[tasks."windows:movie:encode"]
description = "Encode synthetic movies and geometry into SPEAKEASY_MOVIE_PROBE_DIRECTORY and check their timing"
run = [
  "cargo test --locked -p speakeasy-platform encode_synthetic_movie_fragments --release -- --ignored --test-threads=1",
  "cargo test --locked -p speakeasy-platform windows::movie::tests::timing:: --release -- --ignored --test-threads=1",
  "cargo test --locked -p speakeasy-platform a_cancelled_active_movie_releases_its_file_without_a_new_frame --release -- --ignored --test-threads=1",
  "cargo test --locked -p speakeasy-platform receipts_describe_presented_layouts_and_exclude_superseded_inputs --release -- --ignored --test-threads=1",
]

[tasks."movie:prefixes"]
description = "Validate the synthetic movies in SPEAKEASY_MOVIE_FIXTURES and write their prefixes to SPEAKEASY_MOVIE_PREFIX_OUT"
run = "cargo test --locked -p speakeasy-show --test movie_native -- --ignored --nocapture"

[tasks."windows:movie:read"]
description = "Seek and export the recovered movie prefixes in SPEAKEASY_MOVIE_READ_DIRECTORY"
run = [
  "cargo test --locked -p speakeasy-platform recovered_movie_seeks_ --release -- --ignored --test-threads=1",
  "cargo test --locked -p speakeasy native_video_export_ -- --ignored --test-threads=1",
]

[tasks."windows:movie:review"]
description = "Scrub and step the recovered movie prefixes in an owned Show review window"
run = "cargo test --locked -p speakeasy native_show_video_review_ -- --ignored --test-threads=1"

[tasks."windows:movie:crops"]
description = "Check mark crops and annotated exports against the geometry in SPEAKEASY_MOVIE_GEOMETRY_DIRECTORY"
run = [
  "cargo test --locked -p speakeasy native_mark_crops_ -- --ignored --test-threads=1",
  "cargo test --locked -p speakeasy native_annotated_video_exports_ -- --ignored --test-threads=1",
]

[tasks."windows:movie:colors"]
description = "Encode the synthetic color clips the Mac reader checks into SPEAKEASY_MOVIE_PROBE_DIRECTORY"
run = "cargo test --locked -p speakeasy-platform native_movie_color_interoperability -- --ignored --nocapture --test-threads=1"

[tasks."windows:movie:from-mac"]
description = "Check the colors and timestamps of the synthetic Mac movies in SPEAKEASY_MAC_MOVIE_DIRECTORY"
run = "cargo test --locked -p speakeasy-platform native_mac_movies_preserve_colors_and_timestamps -- --ignored --test-threads=1"

[tasks."macos:movie:encode"]
description = "Encode synthetic H.264 fragments into SPEAKEASY_MAC_MOVIE_DIRECTORY and check cancellation"
run = [
  "cargo test --locked -p speakeasy-platform native_mac_movie_encoding -- --ignored --nocapture --test-threads=1",
  "cargo test --locked -p speakeasy-platform movie::recording::tests::a_cancelled_active_movie_releases_its_file_without_a_new_frame -- --ignored --nocapture --test-threads=1",
]

[tasks."macos:movie:from-windows"]
description = "Check the colors of the synthetic Windows clips in SPEAKEASY_WINDOWS_MOVIE_DIRECTORY"
run = "cargo test --locked -p speakeasy-platform native_windows_movie_preserves_colors_on_macos -- --ignored --nocapture --test-threads=1"

[tasks."macos:capture"]
description = "Capture owned synthetic windows from the screen into memory; needs Screen Recording permission"
run = "cargo run --locked -p speakeasy-platform --example mac_capture -- --owned-screen"

[tasks."profile:dictation"]
description = "Replay public fixture speech through the session owner with real inference and report its scores"
run = "cargo test -p speakeasy --release --locked runtime::fixture::profile_recording_dictation -- --exact --ignored --nocapture --test-threads=1"

[tasks."profile:audio"]
description = "Profile synthetic audio sealing and the capture pipeline in a release build"
run = "cargo test -p speakeasy --release --locked profile_audio -- --ignored --nocapture --test-threads=1"

[tasks."profile:latency"]
description = "Report the owner's reply-to-insertion latency with fake devices in a release build"
run = "cargo test -p speakeasy --release --locked profile_ready_text_latency -- --ignored --nocapture"
