min_version = "2026.9.18"

[settings]
task.quiet = true
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[vars]
# Tasks that pipe this list run under bash with pipefail, which /bin/sh lacks on older dash: without
# it a git failure hands the markdown tool an empty list, and it passes.
md_files = '''git ls-files -z --cached --others --exclude-standard -- '*.md' ':(exclude)vendor/' '''

[env]
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"

[tools]
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }
python = "3.15.0"
uv = "0.13.3"
bun = "1.4.3"
shellcheck = "0.11.0"
shfmt = "3.14.1"
# Static Linux build keeps the local gate usable on glibc 2.35.
lychee = { version = "0.24.2", libc = "musl" }
typos = "1.51.1"
actionlint = "1.7.12"

[tasks."rust:lock"]
description = "Refresh workspace dependency requirements through Cargo"
run = "cargo update --workspace"

[tasks."rust:fmt"]
run = "cargo fmt --all"

[tasks."rust:fmt:check"]
run = "cargo fmt --all --check"

# The cross-target run type-checks the native adapters, which need no SDK; the app's Windows
# resource build and macOS GPUI build do, so they stay with native checks.
[tasks."rust:lint"]
run = [
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
  "cargo clippy -p speakeasy-platform --all-targets --all-features --locked --target x86_64-pc-windows-msvc --target aarch64-apple-darwin -- -D warnings",
]

[tasks."rust:doc"]
wait_for = ["rust:lint"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps --locked"

[tasks."rust:test"]
wait_for = ["rust:doc"]
run = [
  "cargo nextest run --workspace --lib --bins --tests --all-features --locked",
  "cargo test --workspace --doc --all-features --locked",
]

[tasks."rust:machete"]
depends = ["rust:fetch"]
env = { CARGO_NET_OFFLINE = "true" }
run = "cargo machete --with-metadata --skip-target-dir crates"

[tasks."rust:fetch"]
description = "Fetch every platform's locked dependency sources for offline analysis"
run = "cargo fetch --locked"

[tasks."rust:standards"]
depends = ["rust:fmt"]

[tasks."rust:standards:check"]
depends = ["rust:fmt:check", "rust:lint", "rust:doc", "rust:test", "rust:machete"]

[tasks."py:lock"]
run = "uv lock"

[tasks."py:install"]
run = "uv sync --locked --quiet"

[tasks."py:fmt:check"]
depends = ["py:install"]
run = "uv run --no-sync ruff format --check --quiet scripts tests"

[tasks."py:lint"]
depends = ["py:install"]
run = "uv run --no-sync ruff check --quiet scripts tests"

[tasks."py:type"]
depends = ["py:install"]
run = "uv run --no-sync basedpyright --warnings"

[tasks."py:test"]
depends = ["py:install"]
run = "uv run --no-sync pytest -q"

[tasks."py:standards"]
depends = ["py:install"]
run = ["uv run --no-sync ruff check --fix --quiet scripts tests", "uv run --no-sync ruff format --quiet scripts tests"]

[tasks."py:standards:check"]
depends = ["py:fmt:check", "py:lint", "py:type", "py:test"]

# shfmt reads .editorconfig only when no parser or printer flags are passed.
[tasks."shell:fmt"]
run = "shfmt -w scripts/*.sh packaging/linux/AppRun"

[tasks."shell:fmt:check"]
run = "shfmt -d scripts/*.sh packaging/linux/AppRun"

[tasks."shell:lint"]
run = "shellcheck --severity=style scripts/*.sh packaging/linux/AppRun"

[tasks."shell:standards"]
depends = ["shell:fmt"]

# The launcher tests exercise the shell scripts, so shell checks run them too.
[tasks."shell:standards:check"]
depends = ["shell:fmt:check", "shell:lint", "py:test"]

[tasks."md:lock"]
run = "bun install"

[tasks."md:install"]
run = "bun install --frozen-lockfile --no-summary"

[tasks."md:fmt:check"]
depends = ["md:install"]
shell = "bash -o errexit -o pipefail -c"
run = "{{vars.md_files}} | xargs -0 bun run prettier --check --no-error-on-unmatched-pattern --log-level warn"

[tasks."md:lint"]
depends = ["md:install"]
shell = "bash -o errexit -o pipefail -c"
run = "{{vars.md_files}} | xargs -0 bun run markdownlint-cli2"

[tasks."md:links"]
run = "lychee --config lychee.toml --root-dir \"$PWD\" --offline --extensions md ."

[tasks."md:links:deep"]
run = "lychee --config lychee.toml --root-dir \"$PWD\" --extensions md ."

[tasks."md:typos"]
run = "typos --config typos.toml ."

[tasks."md:standards"]
depends = ["md:install"]
shell = "bash -o errexit -o pipefail -c"
run = [
  "{{vars.md_files}} | xargs -0 bun run prettier --write --no-error-on-unmatched-pattern",
  "{{vars.md_files}} | xargs -0 bun run markdownlint-cli2 --fix",
]

[tasks."md:standards:check"]
depends = ["md:fmt:check", "md:lint", "md:links", "md:typos"]

[tasks.standards]
depends = ["rust:standards", "py:standards", "shell:standards", "md:standards"]

[tasks."standards:check"]
depends = ["rust:standards:check", "py:standards:check", "shell:standards:check", "md:standards:check", "ci:lint", "hygiene"]

[tasks."ci:lint"]
run = "actionlint"

[tasks."ps:syntax"]
description = "Parse Windows scripts on a native PowerShell host"
shell = "pwsh -NoProfile -Command"
run = """
foreach ($script in Get-ChildItem scripts/*.ps1) {
  $parseErrors = $null
  $tokens = $null
  $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
  if ($parseErrors) { throw ($parseErrors | Out-String) }
}
"""

[tasks.hygiene]
description = "Check committed names, mise task references, and workspace lint inheritance"
run = "python scripts/check_repository.py"
