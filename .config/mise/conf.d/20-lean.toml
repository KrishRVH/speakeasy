# The Lean model of the session machine in formal/. Every task runs there; the gate and its
# guards follow the Lean standards profile.
[env]
# Lake builds every output from pinned source: no downloaded build caches, no
# shared artifact cache, and no cache directory under the home directory.
LAKE_NO_CACHE = "true"
LAKE_ARTIFACT_CACHE = "false"
LAKE_CACHE_DIR = ""
# A Lean panic prints a message and continues with a default value; make every
# panic in the build, the audit, the tests, and the exporter fatal instead.
LEAN_ABORT_ON_PANIC = "1"

[tools."http:lean"]
version = "4.34.1"
url = 'https://github.com/leanprover/lean4/releases/download/v{{ version }}/lean-{{ version }}-{{ os(macos="darwin") }}{{ arch(x64="", arm64="_aarch64") }}.tar.zst'
checksum_url = "https://api.github.com/repos/leanprover/lean4/releases/tags/v{{ version }}"
checksum_expr = 'filter(fromJSON(body).assets, { #.name == filename })[0].digest'
strip_components = 1
bin_path = "bin"

[tools]
"cargo:https://github.com/ammkrn/nanoda_lib" = "rev:3a2407216ee84a75f9e1aead6803d0578be06ae7"

[tasks."lean:build"]
description = "Check Lean source rules, then build every target with warnings as errors"
dir = "{{config_root}}/formal"
run = "scripts/check.sh build"

[tasks."lean:fmt"]
description = "Check Lean text rules; Lean has no formatter to apply"
dir = "{{config_root}}/formal"
depends = ["lean:build"]
run = "lake exe speakeasy_audit format"

[tasks."lean:fmt:check"]
description = "Check Lean text rules"
dir = "{{config_root}}/formal"
depends = ["lean:build"]
run = "lake exe speakeasy_audit format"

# The checks below share Lake's build directory, so they run in turn. Each reruns only after
# its sources change; `mise run --force` reruns it regardless.
[tasks."lean:lint"]
description = "Run the Lean audit: pins, axioms, contracts, docs, linters, IR"
dir = "{{config_root}}/formal"
depends = ["lean:build"]
wait_for = ["lean:fmt:check"]
sources = ["*.lean", "Speakeasy/**/*.lean", "SpeakeasyAudit/**/*.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain", "scripts/*", "../.config/mise/conf.d/20-lean.toml"]
outputs = { auto = true }
run = ["lake lint", "scripts/check.sh shake"]

[tasks."lean:test"]
description = "Run kernel examples and runtime examples of the Lean model"
dir = "{{config_root}}/formal"
depends = ["lean:build"]
wait_for = ["lean:lint"]
sources = ["*.lean", "Speakeasy/**/*.lean", "SpeakeasyAudit/**/*.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain", "scripts/*", "../.config/mise/conf.d/20-lean.toml"]
outputs = { auto = true }
run = "lake test"

[tasks."lean:kernel"]
description = "Recheck every declaration with leanchecker, lean4lean, and nanoda"
dir = "{{config_root}}/formal"
depends = ["lean:build"]
wait_for = ["lean:test"]
sources = ["*.lean", "Speakeasy/**/*.lean", "SpeakeasyAudit/**/*.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain", "scripts/*", "../.config/mise/conf.d/20-lean.toml"]
outputs = { auto = true }
run = ["scripts/check.sh kernel", "scripts/check.sh nanoda"]

[tasks."lean:reproduce"]
description = "Rebuild offline in a fresh directory and require identical outputs"
dir = "{{config_root}}/formal"
depends = ["lean:build"]
wait_for = ["lean:kernel"]
sources = ["*.lean", "Speakeasy/**/*.lean", "SpeakeasyAudit/**/*.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain", "scripts/*", "../.config/mise/conf.d/20-lean.toml"]
outputs = { auto = true }
run = "scripts/check.sh reproduce"

[tasks."lean:standards"]
description = "Run the Lean standards workflow; there are no autofixes"
depends = ["lean:fmt"]

[tasks."lean:standards:check"]
description = "Run the Lean standards gate"
depends = ["lean:fmt:check", "lean:lint", "lean:test", "lean:kernel", "lean:reproduce"]

# A proof covers the Lean model; this check ties the model to the Rust machine by exploring both
# to a fixed point. It reruns only after the machine, the model, or the toolchain changes.
[tasks."lean:conform"]
description = "Explore every state of the Rust and Lean session machines and lifecycles and require identical reports"
depends = ["lean:build"]
sources = ["crates/core/Cargo.toml", "crates/core/src/**/*.rs", "Cargo.lock", "rust-toolchain.toml", "formal/*.lean", "formal/Speakeasy/**/*.lean", "formal/lakefile.toml", "formal/lake-manifest.json", "formal/lean-toolchain", ".config/mise/conf.d/20-lean.toml"]
outputs = { auto = true }
run = [
  "mkdir -p artifacts/machine && rm -f artifacts/machine/rust.txt artifacts/machine/lean.txt artifacts/machine/lifecycle-rust.txt artifacts/machine/lifecycle-lean.txt",
  "SPEAKEASY_EXPLORE_DEPTH=all SPEAKEASY_EXPLORE_REPORT=$PWD/artifacts/machine/rust.txt SPEAKEASY_LIFECYCLE_REPORT=$PWD/artifacts/machine/lifecycle-rust.txt cargo test --locked --release -p speakeasy-core --lib -- machine::explore lifecycle::explore",
  "formal/.lake/build/bin/speakeasy_model all > artifacts/machine/lean.txt",
  "formal/.lake/build/bin/speakeasy_model lifecycle > artifacts/machine/lifecycle-lean.txt",
  "cmp artifacts/machine/rust.txt artifacts/machine/lean.txt",
  "cmp artifacts/machine/lifecycle-rust.txt artifacts/machine/lifecycle-lean.txt",
]
