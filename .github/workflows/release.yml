name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

# A newer push supersedes a release still being built.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.claim.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The main-only gate stays in the step: skipping this job would skip branch packaging too.
      - name: Claim the workspace version
        id: claim
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 0
          test -f docs/release-notes.md
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || { echo "Version $version already belongs to another commit; bump the version." >&2; exit 1; }
          fi

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          install_args: rust
      # Caches compiled registry crates only. Keying by runner image keeps cached Linux objects on
      # the glibc 2.35 floor. Only main saves: branch dispatches restore main's cache but would
      # otherwise spend the repository cache quota on entries that evict it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev pkg-config
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Package Linux against glibc 2.35
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speakeasy-${{ runner.os }}
          path: |
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the workspace version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          notes="docs/release-notes.md"
          assets=(speakeasy-windows-x64.zip speakeasy-macos.zip speakeasy-linux-x86_64.AppImage speakeasy-linux-x86_64.tar.gz)
          cd artifacts
          sha256sum "${assets[@]}" > SHA256SUMS
          cd ..
          for index in "${!assets[@]}"; do assets[index]="artifacts/${assets[index]}"; done
          assets+=(artifacts/SHA256SUMS)
          # Git refuses to move an existing tag, so a version another commit claimed after the
          # version job fails here, before --clobber. A rejected push is fine only when the remote
          # tag, lightweight or annotated, already points at this commit.
          if ! git push origin "$GITHUB_SHA:refs/tags/$tag"; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || { echo "Version $VERSION already belongs to another commit; bump the version." >&2; exit 1; }
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --draft --title "Speakeasy $VERSION" --notes-file "$notes"
          fi
          gh release edit "$tag" --draft=false --title "Speakeasy $VERSION" --notes-file "$notes"
