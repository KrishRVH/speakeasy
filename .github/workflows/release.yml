name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'settings.example.json', 'packaging/**', 'scripts/package-*', '.github/workflows/release.yml']

permissions:
  contents: read

# A newer push supersedes a release still being built.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  package:
    strategy:
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speakeasy-${{ runner.os }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Update the release for the workspace version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          tag="v$version"
          notes="Windows and macOS builds of ${GITHUB_SHA::7}. On first launch, Speakeasy downloads the speech engine and model that suit the machine."
          git tag --force "$tag"
          git push --force origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" artifacts/*.zip --title "Speakeasy $version" --notes "$notes"
          fi
