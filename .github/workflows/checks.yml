name: macOS checks
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main, high-perf-macos]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
      - name: Verify
        run: mise run standards:check
      - name: Check native rendering and frame-source lifetime
        timeout-minutes: 3
        run: cargo run --locked -p speakeasy --example check_native_rendering -- --native-gui
      - name: Package
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speakeasy-macOS
          path: artifacts/speakeasy-macos.zip
          if-no-files-found: error
