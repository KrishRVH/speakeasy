name: Check
on:
  workflow_dispatch:
    inputs:
      installer:
        description: Build the Windows installer on the HP and test it on a GitHub-hosted desktop
        type: boolean
        default: false
      mac_updates:
        description: Check owned Mac update shutdown without devices or input
        type: boolean
        default: false
      movie:
        description: Check native movie playback and Windows-to-Mac colors with synthetic files
        type: boolean
        default: false
      screen:
        description:
          With movie, explicitly opt into owned-window Mac screen capture without saving pixels
        type: boolean
        default: false
      movie_fixture_run:
        description:
          With movie, reuse the synthetic Windows movies of the run with this ID for a focused Mac
          decoder check
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ inputs.installer && 'installer' || 'regular' }}
  cancel-in-progress: true

# The Linux gate cannot build for macOS or Windows MSVC without their SDKs, so that code builds and
# runs here, on the self-hosted Windows PC and Mac mini. Their tools persist, so mise skips the cache.
jobs:
  native:
    name: native (${{ matrix.system }})
    if: ${{ !inputs.mac_updates && (!inputs.movie || !inputs.movie_fixture_run) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: [self-hosted, Windows, X64, hp, speakeasy]
          - system: macos
            runner: [speakeasy-mac-mini]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: false
          install_args: rust github:nextest-rs/nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check-${{ matrix.system }}
      - run: mise run rust:lint:host
      - name: Check macOS movie playback
        if: runner.os == 'macOS' && inputs.movie
        timeout-minutes: 10
        run: |
          command -v ffmpeg > /dev/null || brew install ffmpeg
          bash scripts/check-movie-macos.sh
      - name: Encode a Windows movie for color acceptance
        if: runner.os == 'Windows' && inputs.movie
        shell: pwsh
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Path artifacts/movie -Force | Out-Null
          $env:SPEAKEASY_MOVIE_PROBE_DIRECTORY = Join-Path $PWD 'artifacts/movie'
          mise run windows:movie:colors
          if ($LASTEXITCODE -ne 0) { throw 'Native movie color acceptance failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows' && inputs.movie
        with:
          name: windows-movie
          path: artifacts/movie/*.mp4
          if-no-files-found: error
          retention-days: 1
      - run: mise run rust:test
      - name: Check paste on a private window station
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          mise run windows:clipboard
          if ($LASTEXITCODE -ne 0) { throw 'The private window station clipboard check failed.' }
      - name: Build the Windows installer for acceptance
        if: runner.os == 'Windows' && inputs.installer
        shell: pwsh
        run: |
          mise install github:EmbarkStudios/cargo-about
          ./scripts/package-windows.ps1
      - name: Upload the Windows installer for acceptance
        if: runner.os == 'Windows' && inputs.installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: artifacts/speakeasy-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  installer-desktop:
    if: ${{ inputs.installer }}
    needs: native
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: artifacts
      - name: Check the Windows update handoff
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/check-installer.ps1 -Installer artifacts/speakeasy-windows-x64-setup.exe

  mac-updates:
    if: ${{ inputs.mac_updates }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check-macos-15
      # The action installs only Rust here; installing the gate's other tools would slow the job.
      - run: mise run rust:lint:host
        env:
          MISE_TASK_RUN_AUTO_INSTALL: false
      - name: Check owned Mac quit and update cleanup
        timeout-minutes: 10
        run: bash scripts/check-update-macos.sh

  movie-colors:
    if:
      ${{ always() && inputs.movie && (needs.native.result == 'success' || inputs.movie_fixture_run
      != '') }}
    needs: native
    runs-on: speakeasy-mac-mini
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # With movie_fixture_run the native matrix is skipped, so after a pin change task auto-install
    # would install every tool here; these tasks need only Rust.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: false
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-movie
          path: artifacts/movie
          run-id: ${{ inputs.movie_fixture_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Decode the Windows movie on macOS
        timeout-minutes: 5
        run: |
          export SPEAKEASY_WINDOWS_MOVIE_DIRECTORY="$PWD/artifacts/movie"
          mise run macos:movie:from-windows
      - name: Check native Mac movie encoding
        timeout-minutes: 5
        run: |
          export SPEAKEASY_MAC_MOVIE_DIRECTORY="$PWD/artifacts/mac-movie"
          mise run macos:movie:encode
          mise run macos:stream
      - name: Check owned Mac screen capture
        if: ${{ inputs.screen }}
        timeout-minutes: 2
        run: mise run macos:capture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-movie
          path: artifacts/mac-movie/*.mp4
          if-no-files-found: ignore
          retention-days: 1
