name: Native builds
on:
  workflow_dispatch:
  push:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'settings.example.json', 'packaging/**', 'scripts/package-*', '.github/workflows/ci.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'settings.example.json', 'packaging/**', 'scripts/package-*', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Portable behavior checks
        run: cargo test --workspace --locked
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speakeasy-${{ matrix.os }}
          path: artifacts/rust/*.zip
          if-no-files-found: error
